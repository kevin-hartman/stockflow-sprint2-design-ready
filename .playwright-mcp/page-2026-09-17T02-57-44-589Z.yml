    - generic [ref=e1604]:
      - heading "Frequently Asked Questions" [level=2] [ref=e1605]
      - generic [ref=e1612]:
        - generic [ref=e1613]:
          - heading "What is an inventory management system?" [level=3] [ref=e1621]
          - paragraph [ref=e1629]: An inventory management system is software that tracks stock levels, orders, sales, and deliveries across warehouses and sales channels in real time. Fishbowl's inventory management system adds multi-location tracking, barcode scanning, manufacturing support, and two-way QuickBooks and Xero integration.
        - generic [ref=e1630]:
          - heading "What is the best inventory management software for small businesses?" [level=3] [ref=e1638]
          - paragraph [ref=e1646]: The best inventory management software for small businesses depends on your workflows, but the top options for growing SMBs with QuickBooks or Xero are Fishbowl, Cin7, and Zoho Inventory. Fishbowl is purpose-built for manufacturers, distributors, and product businesses that need multi-warehouse management, barcode scanning, and deep accounting integration.
        - generic [ref=e1647]:
          - heading "How much does inventory management software cost?" [level=3] [ref=e1655]
          - paragraph [ref=e1663]: Inventory management software typically costs between $100 and $500 per month for small and mid-size businesses, with enterprise plans running higher. Fishbowl offers flexible pricing based on your warehouse count and user needs.
        - generic [ref=e1664]:
          - heading "How can Fishbowl benefit small businesses?" [level=3] [ref=e1672]
          - paragraph [ref=e1680]: Inventory control software like Fishbowl helps to automate processes, reduce human error, and manage the flow of company inventory. Fishbowl’s comprehensive solution empowers you to manage inventory across multiple locations and fulfill orders across multiple sales channels. When there’s low stock and it’s time to reorder, Fishbowl can generate a report to show you exactly what’s needed. And it can automatically generate purchase orders containing the appropriate vendors, part quantities, and shipping address to speed up the procurement process.
        - generic [ref=e1681]:
          - heading "How does Fishbowl integrate with QuickBooks?" [level=3] [ref=e1689]
          - paragraph [ref=e1697]: Fishbowl seamlessly connects with both QuickBooks Desktop and QuickBooks Online, allowing you to manage inventory and manufacturing in Fishbowl while maintaining your financial records in QuickBooks. This powerful integration eliminates double entry, reduces errors, and gives you a complete view of your business operations.
        - generic [ref=e1698]:
          - heading "Does Fishbowl support multiple warehouse locations?" [level=3] [ref=e1706]
          - paragraph [ref=e1714]: Absolutely. Fishbowl is built to handle the complexity of multi-location operations, giving you complete visibility and control across all your warehouses and distribution centers. Whether you're managing two locations or twenty, Fishbowl provides the tools you need to operate efficiently at scale.
        - generic [ref=e1715]:
          - heading "Can Fishbowl handle manufacturing workflows?" [level=3] [ref=e1723]
          - paragraph [ref=e1731]: Yes, and it excels at it. Fishbowl provides comprehensive manufacturing capabilities designed to streamline your entire production process, from initial planning through final assembly. Whether you're running a small fabrication shop or managing complex multi-stage production, Fishbowl gives you the control and visibility you need to manufacture efficiently.
        - generic [ref=e1732]:
          - heading "How long does it take to implement inventory management software?" [level=3] [ref=e1740]
          - paragraph [ref=e1748]: Everything you need to go live with confidence in 2-6 weeks. Fishbowl implementation is a comprehensive, expert-led process designed to set your business up for success from day one. Unlike competitors who hand you off to third-party consultants or leave you to figure things out on your own, Fishbowl provides dedicated, in-house support from experienced professionals who guide you through every step—from initial database creation to integration testing and beyond.
